[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "furniture-timer"
version = "0.1.0"
description = "Always-on-top work-time tracker with cost calculation for furniture design."
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.6",
    "platformdirs>=4.0",
    "pynput>=1.7; sys_platform != 'win32'",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.gui-scripts]
furniture-timer = "furniture_timer.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
